<!DOCTYPE html>
<html lang="en" data-deck-id="a1-test">
<head><meta charset="utf-8"><title>A1 test deck</title>
<style>
:root{--font-body:system-ui,sans-serif;--font-display:Georgia,serif;--font-mono:ui-monospace,monospace;
--text-primary:#14171c;--deck-chrome-accent:#2f5aff;--deck-chrome-border:rgba(0,0,0,.18);
--deck-chrome-surface:#fff;--deck-chrome-text:#14171c;--body-size:18px;--small-size:14px;}
body{margin:0;font-family:var(--font-body);color:var(--text-primary)}
.slides{position:relative}
section.slide{position:relative;width:100vw;height:100vh;background:#fff;overflow:hidden}
.slide-edit-layer{position:absolute;inset:0}
h1{font-family:var(--font-display);font-size:64px;margin:0}
</style></head>
<body>
  <section class="slide" id="s0"><div class="slide-edit-layer">
    <div class="slide-object" data-slide-object data-oid="s0-title" data-object-type="text" data-fx-enter="fade-up" data-fx-order="1" style="left:6%;top:20%;width:70%;">
      <div class="slide-object-text" contenteditable="true"><h1>A1 test</h1></div></div>
    <div class="slide-object" data-slide-object data-oid="s0-page" data-object-type="text" style="left:88%;top:90%;width:8%;height:5%;">
      <div class="slide-object-text" contenteditable="true"><span data-field="page">1</span> / <span data-field="pages">1</span></div></div>
  </div></section>
  <section class="slide" id="s1"><div class="slide-edit-layer">
    <div class="slide-object" data-slide-object data-oid="s1-page" data-object-type="text" style="left:88%;top:90%;width:8%;height:5%;">
      <div class="slide-object-text" contenteditable="true"><span data-field="page">2</span> / <span data-field="pages">2</span></div></div>
  </div></section>
</body></html>
