<!-- Deck chrome HTML — extracted from frontend-slides-editable/examples/editable-deck-reference.html
     Lines 435-483. Drop-in: paste right after <body>, before <div class="slides-offset">. -->

<div class="deck-left-hover-anchor" id="deckLeftHover" aria-label="Deck controls">
  <div class="deck-left-row deck-bar-lead">
    <span class="deck-title" id="deckTitle" contenteditable="true" spellcheck="false"
          role="textbox" aria-label="Deck title">Untitled deck</span>
    <button type="button" class="edit-toggle" id="editToggle" title="Edit mode (E) — hover this corner to show">Edit</button>
  </div>

  <div class="deck-edit-chrome deck-left-row deck-left-row--tools" id="deckEditChrome" data-deck-chrome-surface="" role="toolbar" aria-label="Editing">
    <button type="button" id="btnUndo" aria-label="Undo" title="Undo (Ctrl+Z)">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14l-4-4 4-4M5 10h8a5 5 0 010 10h-2"/></svg>
    </button>
    <button type="button" id="btnRedo" aria-label="Redo" title="Redo (Ctrl+Y / Ctrl+Shift+Z)">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 14l4-4-4-4M19 10h-8a5 5 0 000 10h2"/></svg>
    </button>
    <span class="deck-bar-sep" aria-hidden="true"></span>
    <button type="button" class="deck-tool" data-insert="text" title="Text box">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 6h14M12 6v12M9 18h6"/></svg><span>Text</span>
    </button>
    <div class="deck-menu" data-menu="shape">
      <button type="button" class="deck-tool deck-menu-btn" data-menu-toggle aria-haspopup="true" aria-expanded="false" title="Shape">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="6" width="16" height="12" rx="2"/></svg><span>Shape</span>
      </button>
      <div class="deck-menu-list deck-menu-list--grid" role="menu">
        <button type="button" data-shape="rect" aria-label="Rectangle" title="Rectangle">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="6" width="16" height="12" rx="1"/></svg>
        </button>
        <button type="button" data-shape="ellipse" aria-label="Ellipse" title="Ellipse">
          <svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="12" rx="8" ry="6"/></svg>
        </button>
        <button type="button" data-shape="line" aria-label="Line" title="Line">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 18L20 6"/></svg>
        </button>
        <button type="button" data-shape="arrow" aria-label="Arrow" title="Arrow">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h13M13 7l5 5-5 5"/></svg>
        </button>
      </div>
    </div>
    <button type="button" class="deck-tool" data-insert="image" title="Image">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="10" r="1.5"/><path d="M21 16l-5-5-5 5-2-2-4 4"/></svg><span>Image</span>
    </button>
    <button type="button" class="deck-tool" data-insert="media" title="Video or audio">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M11 10l4 2-4 2z"/></svg><span>Media</span>
    </button>
    <button type="button" class="deck-tool" data-insert="table" title="Table">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="1"/><path d="M3 10h18M3 15h18M9 5v14M15 5v14"/></svg><span>Table</span>
    </button>
    <button type="button" class="deck-tool" data-insert="chart" title="Chart">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span>Chart</span>
    </button>
    <span class="deck-bar-sep" aria-hidden="true"></span>
    <button type="button" class="sidebar-pages-toggle" id="pagesToggle" title="Pages sidebar">Pages</button>
    <button type="button" class="deck-btn-save" id="btnSave" title="Save layout to browser (Ctrl+S)">Save</button>
  </div>

  <div class="deck-left-row deck-bar-trail">
    <div class="deck-menu deck-menu--end" data-menu="export">
      <button type="button" class="deck-menu-btn" data-menu-toggle aria-haspopup="true" aria-expanded="false">Export</button>
      <div class="deck-menu-list" role="menu">
        <button type="button" role="menuitem" id="btnExport">HTML file</button>
        <button type="button" role="menuitem" id="btnExportPdf">PDF</button>
      </div>
    </div>
    <button type="button" class="deck-btn-present" data-present="start" title="Present (P)">Present</button>
    <button type="button" class="deck-btn-done" id="btnDoneEdit">Done</button>
  </div>
</div>

<!-- hidden file inputs for image and media upload -->
<input type="file" id="deckImgInput"   accept="image/*" style="display:none">
<input type="file" id="deckBgInput"    accept="image/*" style="display:none">
<input type="file" id="deckMediaInput" accept="video/*,audio/*" style="display:none">

<!-- Present controls: only visible while presenting -->
<div class="deck-present-bar" id="deckPresentBar" data-deck-chrome-surface="">
  <button type="button" data-present="prev" aria-label="Previous slide">‹</button>
  <span class="deck-present-count" id="deckPresentCount">1 / 1</span>
  <button type="button" data-present="next" aria-label="Next slide">›</button>
  <button type="button" data-present="speaker" title="Speaker view (S)">Speaker view</button>
  <button type="button" class="deck-present-exit" data-present="exit" title="Exit (Esc)">Exit &nbsp;<kbd>Esc</kbd></button>
</div>

<button type="button" class="deck-panel-handle deck-panel-handle--left" data-panel-toggle="left"
        aria-label="Show or hide the slide list" title="Slides"></button>
<button type="button" class="deck-panel-handle deck-panel-handle--right" data-panel-toggle="right"
        aria-label="Show or hide properties" title="Properties"></button>

<div class="progress-bar" id="progressBar"></div>
<nav class="nav-dots" id="navDots" aria-label="Slides"></nav>

<aside class="slide-sidebar" id="slideSidebar" aria-label="Slide pages">
  <h3>Slides</h3>
  <div class="filmstrip-list" id="filmstripList"></div>
  <div class="filmstrip-actions" style="margin-top:auto;flex-direction:column;gap:6px;">
    <button type="button" id="btnNewSlide" style="width:100%;">New slide</button>
    <button type="button" id="btnDuplicateSlide" style="width:100%;">Duplicate slide</button>
  </div>
</aside>

<!-- Inspector: page-level and selection-level properties, right-hand side -->
<aside class="deck-inspector" id="deckInspector" data-deck-chrome-surface="" aria-label="Properties">

  <!-- selection sections: shown only when an object is selected -->
  <section class="deck-sect" id="sectSelection" hidden>
    <h4 class="deck-sect-head" data-fold><span class="deck-sect-caret"></span><span id="sectSelectionName">Selection</span>
      <span class="deck-sect-tools">
        <button type="button" data-obj="duplicate" title="Duplicate (Ctrl+D)" aria-label="Duplicate">⧉</button>
        <button type="button" data-obj="delete" title="Delete" aria-label="Delete">🗑</button>
      </span>
    </h4>
    <div class="deck-sect-body">
      <div class="deck-field"><span class="deck-field-label">Role</span>
        <div class="deck-field-row">
          <button type="button" data-role-set="title">Title</button>
          <button type="button" data-role-set="subtitle">Subtitle</button>
          <button type="button" data-role-set="body">Body</button>
          <button type="button" data-role-set="kicker">Kicker</button>
        </div>
      </div>
    </div>
  </section>

  <section class="deck-sect" id="sectGeometry" hidden>
    <h4 class="deck-sect-head" data-fold><span class="deck-sect-caret"></span>Size &amp; arrange</h4>
    <div class="deck-sect-body">
      <div class="deck-grid2">
        <label>W <input type="number" data-geom="width" step="0.5"><i>%</i></label>
        <label>H <input type="number" data-geom="height" step="0.5"><i>%</i></label>
      </div>
      <div class="deck-field"><span class="deck-field-label">Opacity</span>
        <div class="deck-field-row"><input type="range" data-geom="opacity" min="0" max="100" step="1"><output data-geom-out="opacity">100</output></div>
      </div>
      <div class="deck-field"><span class="deck-field-label">Order</span>
        <div class="deck-field-row deck-split2">
          <button type="button" data-arrange="front" title="Bring to front">Bring to front</button>
          <button type="button" data-arrange="back" title="Send to back">Send to back</button>
        </div>
      </div>
      <div class="deck-field"><span class="deck-field-label">Centre on the slide</span>
        <div class="deck-field-row deck-split2">
          <button type="button" data-arrange="hcenter" title="Centre horizontally">Horizontally</button>
          <button type="button" data-arrange="vcenter" title="Centre vertically">Vertically</button>
        </div>
      </div>
    </div>
  </section>

  <section class="deck-sect" id="sectText" hidden>
    <h4 class="deck-sect-head" data-fold><span class="deck-sect-caret"></span>Typography</h4>
    <div class="deck-sect-body">
      <div class="deck-field"><span class="deck-field-label">Font</span>
        <div class="deck-field-row">
          <select data-text-font aria-label="Font"><option value="">Inherit</option></select>
        </div>
      </div>
      <div class="deck-field"><span class="deck-field-label">Size</span>
        <div class="deck-field-row">
          <input type="number" data-text-size min="6" max="400" step="1"><i class="deck-unit">px</i>
        </div>
      </div>
      <div class="deck-field"><span class="deck-field-label">Colour</span>
        <div class="deck-field-row"><input type="color" data-text-colour><button type="button" data-text-colour-reset>Reset</button></div>
      </div>
    </div>
  </section>

  <section class="deck-sect" id="sectTable" hidden>
    <h4 class="deck-sect-head" data-fold><span class="deck-sect-caret"></span>Table</h4>
    <div class="deck-sect-body">
      <div class="deck-field"><span class="deck-field-label">Rows</span>
        <div class="deck-field-row"><button type="button" data-table="row+">Add</button><button type="button" data-table="row-">Remove</button></div>
      </div>
      <div class="deck-field"><span class="deck-field-label">Columns</span>
        <div class="deck-field-row"><button type="button" data-table="col+">Add</button><button type="button" data-table="col-">Remove</button></div>
      </div>
    </div>
  </section>

  <section class="deck-sect" id="sectChart" hidden>
    <h4 class="deck-sect-head" data-fold><span class="deck-sect-caret"></span>Chart</h4>
    <div class="deck-sect-body">
      <div class="deck-field"><span class="deck-field-label">Type</span>
        <div class="deck-field-row">
          <button type="button" data-chart-type="bar">Bar</button>
          <button type="button" data-chart-type="line">Line</button>
          <button type="button" data-chart-type="pie">Pie</button>
        </div>
      </div>
      <div class="deck-field"><span class="deck-field-label">Data</span>
        <div class="deck-field-row"><input type="text" data-chart-data-input placeholder="Q1 12, Q2 18"></div>
      </div>
    </div>
  </section>

  <section class="deck-sect" id="sectMotion" hidden>
    <h4 class="deck-sect-head" data-fold><span class="deck-sect-caret"></span>Motion</h4>
    <div class="deck-sect-body">
      <div class="deck-field"><span class="deck-field-label">Entrance</span>
        <div class="deck-field-row">
          <select data-fx-enter-set aria-label="Entrance animation">
            <option value="">None</option>
            <option value="fade">Fade</option>
            <option value="fade-up">Fade up</option>
            <option value="fade-down">Fade down</option>
            <option value="slide-left">From the right</option>
            <option value="slide-right">From the left</option>
            <option value="slide-up">From below</option>
            <option value="slide-down">From above</option>
          </select>
        </div>
      </div>
      <div class="deck-field"><span class="deck-field-label">Numbers</span>
        <div class="deck-field-row"><button type="button" data-fx-countup-toggle>Count up from zero</button></div>
      </div>
      <p class="deck-hint" id="morphHint" hidden></p>
    </div>
  </section>

  <!-- slide sections: always shown -->
  <section class="deck-sect" id="sectSlide">
    <h4 class="deck-sect-head" data-fold><span class="deck-sect-caret"></span>Slide</h4>
    <div class="deck-sect-body">
      <div class="deck-field"><span class="deck-field-label">Background</span>
        <div class="deck-field-row">
          <input type="color" data-slide-bg>
          <button type="button" data-slide-bg-image>Image…</button>
          <button type="button" data-slide-bg-reset>Reset</button>
        </div>
      </div>
      <div id="bgImageRow" hidden>
        <div class="deck-field"><span class="deck-field-label">Image size</span>
          <div class="deck-field-row">
            <select data-bg-size aria-label="Background image size">
              <option value="cover">Cover</option>
              <option value="contain">Contain</option>
              <option value="100% 100%">Stretch</option>
              <option value="auto">Original</option>
            </select>
            <button type="button" data-bg-image-clear title="Remove the image">Clear</button>
          </div>
        </div>
        <div class="deck-field"><span class="deck-field-label">Image opacity</span>
          <div class="deck-field-row">
            <input type="range" data-bg-opacity min="0" max="100" step="1"><output data-bg-opacity-out>100</output>
          </div>
        </div>
      </div>
      <div class="deck-field">
        <label class="deck-check"><input type="checkbox" data-slide-skip> Skip when presenting</label>
      </div>
      <p class="deck-hint" id="slidePos"></p>
    </div>
  </section>

  <section class="deck-sect" id="sectNotes">
    <h4 class="deck-sect-head" data-fold><span class="deck-sect-caret"></span>Speaker notes</h4>
    <div class="deck-sect-body">
      <textarea id="slideNotes" class="slide-notes" rows="6"
        placeholder="Notes for this slide — saved in the file, so they travel with it."></textarea>
    </div>
  </section>
</aside>

<div class="rte-toolbar" id="rteToolbar" role="toolbar" aria-label="Text format" data-deck-chrome-surface="">
  <span class="rte-toolbar-group"><button type="button" data-cmd="bold"><strong>B</strong></button>
  <button type="button" data-cmd="italic"><em>I</em></button></span>
  <span class="rte-toolbar-group" aria-label="Font family">
    <span class="rte-toolbar-meta">Font</span>
    <button type="button" data-font="var(--font-body)">Body</button>
    <button type="button" data-font="var(--font-display)">Display</button>
  </span>
  <span class="rte-toolbar-group" aria-label="Font size">
    <button type="button" data-size-step="-1" title="Smaller (1px)">A−</button>
    <button type="button" data-size-step="1" title="Larger (1px)">A+</button>
  </span>
  <span class="rte-toolbar-group" aria-label="Insert field">
    <span class="rte-toolbar-meta">Field</span>
    <button type="button" data-field-insert="page" title="Page number, kept live">#</button>
    <button type="button" data-field-insert="pages" title="Total pages, kept live">/n</button>
    <button type="button" data-field-insert="title" title="Deck title, kept live">Title</button>
    <button type="button" data-field-insert="date" title="Today's date">Date</button>
  </span>
</div>
